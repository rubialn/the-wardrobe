<!DOCTYPE html> <!-- informs to the browser that the document is using modern HTML -->
<html lang="en"> <!-- defines english as the page language -->

<head> <!-- contains the page settings and information (metadata) -->
    <meta charset="UTF-8"> <!-- defines the character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- helps to adapt the page to the width of smaller screens -->
    <title>The Wardrobe - Collection</title> <!-- names the page on the browser tab -->
</head>

<body> <!-- holds the page content displayed on the screen -->
    <header> <!-- holds the introductory content -->
        <h1>The Wardrobe - Collection</h1> <!-- main heading -->
        <p>Clothing for everyday life.</p>

        <nav aria-label="Main navigation"> <!-- nav holds the main navigation links and aria-label gives the nav an accessible name-->
            <a href="index.html" aria-current="page">Collection</a> <!-- creates a link to index.html and tells to assistive technologies that it is the current page -->
            <a href="weather.html">Weather</a> <!-- creates a link to the weather.html page -->
        </nav>
    </header>

    <main> <!-- holds the main content of the page -->
        <h2>Our Collection</h2>
        <p>Explore our clothing collection and check product availability.</p>
    </main>
</body>

</html>
