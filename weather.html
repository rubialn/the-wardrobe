<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wardrobe - Weather</title>
    <script src="js/weather.js" defer></script> <!-- loads the java script file -->
</head>

<body>
    <header>
        <h1>The Wardrobe - Weather</h1>
        <p>Clothing for everyday life.</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Collection</a>
            <a href="weather.html" aria-current="page">Weather</a>
        </nav>
    </header>

    <main>
        <h2>Check the Weather</h2>
        <p>Check the weather in your city before choosing your outfit.</p>
        
        <form id="weather-form"> <!-- groups the form controls and creates an ID for Java Script -->
            <label for="city">City name</label> <!-- labels the input with the id city -->
            <input type="text" id="city" name="city" required> <!-- creates a required text field for the the city name -->
            <button type="submit">Check weather</button> <!-- submits the form -->
        </form>

        <p id="weather-message" role="status"></p> <!-- displays the status message and shows the updates to the user -->
        <div id="weather-result"></div> <!-- holds the weather information that he Java Script adds -->
    </main>
</body>

</html>
